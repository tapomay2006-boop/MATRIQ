<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matriq-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5ECCF" />
      <stop offset="45%" stop-color="#A8DD73" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <filter id="matriq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#A8DD73" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="48" height="48" rx="12" fill="#121013" />
  <rect width="48" height="48" rx="12" stroke="#A8DD73" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

