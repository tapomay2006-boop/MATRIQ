  <polygon points="24,28 27,33 24,37 21,33" fill="#FFFFFF" opacity="0.9" />
  <line x1="20" y1="22.5" x2="24" y2="26" stroke="#FFFFFF" stroke-width="1" opacity="0.7" />
  <line x1="28" y1="22.5" x2="24" y2="26" stroke="#FFFFFF" stroke-width="1" opacity="0.7" />
