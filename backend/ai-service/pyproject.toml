[project]
name = "ai-service"
version = "0.1.0"
description = "NUMM material standardization and matching pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.118.0",
    "sqlalchemy>=2.0.43",
    "aiosqlite>=0.20.0",
    "rapidfuzz>=3.9.0",
    "qdrant-client>=1.12.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "httpx>=0.28.0",
    "numpy>=2.3.0",
    "tenacity>=9.1.0",
    "pint>=0.24",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
embeddings = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
]
qdrant = [
    "qdrant-client>=1.12.0",
]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# The two vendored files are copies of backend/pipeline-one's
# inference_engine.py and session_store.py. Reformatting them would break the
# re-sync rule in their headers - the whole point is that `cp` from
# pipeline-one is a clean update - so they are linted there, not here.
exclude = ["app/logic/extraction.py", "app/logic/review_sessions.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    # /extract/csv is multipart: File() and Form() are how FastAPI declares
    # those parameters, and they are as immutable as Query().
    "fastapi.File", "fastapi.Form",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
